<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Details | Ennaval by srivi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-body">
      <div class="page-shell">
        <a class="back-link" href="index.html">← Back to store</a>
        <div class="product-detail-card">
          <img id="detailImage" class="detail-visual" src="" alt="Selected product" />
          <div>
            <p class="eyebrow" id="detailTag">New arrival</p>
            <h1 id="detailTitle">Product</h1>
            <p id="detailDesc">Elegant fashion piece crafted for modern style.</p>
            <div class="price-row">
              <span class="price-tag" id="detailPrice">₹0</span>
              <span>Free shipping over ₹2,000</span>
            </div>
            <form class="detail-form">
              <label>
                Size
                <select id="sizeSelect">
                  <option>XS</option>
                  <option>S</option>
                  <option selected>M</option>
                  <option>L</option>
                  <option>XL</option>
                </select>
              </label>
              <label>
                Quantity
                <input type="number" min="1" value="1" />
              </label>
              <button type="button" class="btn btn-primary" id="checkoutBtn">Proceed to checkout</button>
            </form>
          </div>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
